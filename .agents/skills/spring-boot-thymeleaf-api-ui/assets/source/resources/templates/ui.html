<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>환영합니다 - Back-end API</title>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
	
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { 
			font-family: 'Noto Sans KR', sans-serif; 
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}
		.container {
			max-width: 600px;
			width: 100%;
			background: white;
			border-radius: 20px;
			padding: 60px 40px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			text-align: center;
		}
		h1 {
			font-size: 2.5rem;
			font-weight: 700;
			color: #2d3748;
			margin-bottom: 20px;
			line-height: 1.3;
		}
		.subtitle {
			font-size: 1.125rem;
			color: #718096;
			margin-bottom: 40px;
			line-height: 1.6;
		}
		.info-box {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			padding: 30px;
			border-radius: 15px;
			margin-bottom: 30px;
		}
		.info-box p {
			font-size: 0.95rem;
			margin-bottom: 12px;
			opacity: 0.95;
		}
		.info-box p:last-child {
			margin-bottom: 0;
		}
		.info-box strong {
			font-weight: 600;
		}
		.status {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: #f7fafc;
			padding: 12px 24px;
			border-radius: 50px;
			font-size: 0.9rem;
			color: #4a5568;
			margin-top: 20px;
		}
		.status-dot {
			width: 10px;
			height: 10px;
			background: #48bb78;
			border-radius: 50%;
			animation: pulse 2s infinite;
		}
		@keyframes pulse {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.5; }
		}
		footer {
			margin-top: 40px;
			padding-top: 30px;
			border-top: 1px solid #e2e8f0;
			color: #a0aec0;
			font-size: 0.875rem;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>
			<span th:if="${name != null}" th:text="${name} + '님'">사용자님</span>
			<span th:unless="${name != null}">여러분</span>
			<br/>환영합니다
		</h1>
		
		<p class="subtitle">
			간단하고 깔끔한 백엔드 API 서비스입니다.<br/>
			안정적이고 빠른 성능을 제공합니다.
		</p>
		
		<div class="info-box">
			<p><strong>Spring Boot API</strong></p>
			<p>RESTful 엔드포인트 제공</p>
			<p>안전한 데이터 처리</p>
			<p>서버 시간: <strong th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}">2026-05-05 12:00:00</strong></p>
		</div>
		
		<div class="status">
			<span class="status-dot"></span>
			<span>서비스 정상 운영 중</span>
		</div>
		
		<footer>
			&copy; 2026 Back-end API
		</footer>
	</div>
</body>
</html>
