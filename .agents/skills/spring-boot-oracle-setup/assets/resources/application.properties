# 기존 application.properties의 관련 키에 병합하는 Oracle 연결 예제
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}

# 기존 H2 초기화 SQL이 Oracle에서 자동 실행되지 않게 한다.
spring.sql.init.mode=never

# 대상 프로젝트의 MyBatis 경로를 유지한다.
mybatis.config-location=classpath:mybatis/mybatis_config.xml
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml
