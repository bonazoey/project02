# 애플리케이션 및 메모리 DB 설정
spring.application.name=spring_boot_project
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql
mybatis.config-location=classpath:mybatis/mybatis_config.xml
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml
# 클래스와 메소드 이름을 포함한 컬러 로그
spring.output.ansi.enabled=always
logging.pattern.console=%clr([%level]) %clr(%logger{0}.%M\\(\\)): %msg%n